<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap">
  <style>
    body { margin: 0; background: #05070c; }
    a { color: #fb7185; } a:hover { color: #fda4af; }
    .sans { font-family: "Segoe UI", "Open Sans", system-ui, sans-serif; }
    .mono { font-family: Consolas, "Roboto Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div class="sans" style="width: 1600px; height: 900px; background: #05070c; color: #f1f5f9; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; right: 0; height: 470px; background: linear-gradient(145deg, #3a1020 0%, #1a1030 46%, #0a1224 100%);"></div>
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 470px; background-image: radial-gradient(circle at 74% 22%, rgba(225,29,72,0.42) 0%, transparent 50%), radial-gradient(circle at 22% 70%, rgba(56,189,248,0.16) 0%, transparent 46%);"></div>
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 470px; background-image: repeating-linear-gradient(115deg, rgba(0,0,0,0.14) 0 2px, transparent 2px 40px);"></div>
  <div style="position: absolute; left: 0; right: 0; top: 250px; height: 260px; background: linear-gradient(to bottom, rgba(5,7,12,0) 0%, #05070c 88%);"></div>

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 46px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="font-size: 17px; font-weight: 700; letter-spacing: 5px;">{{cafeName}}</div>
      <div style="width: 1px; height: 18px; background: rgba(255,255,255,0.18);"></div>
      <div class="mono" style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: #fb7185;">PC-01</div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="text-align: right;">
        <div style="font-size: 9.5px; font-weight: 700; letter-spacing: 2.6px; color: rgba(255,255,255,0.5);">TIME LEFT</div>
        <div class="mono" style="margin-top: 1px; font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -1px; color: #ffffff;">47:12</div>
      </div>
      <div style="width: 5px; height: 46px; background: rgba(255,255,255,0.12); position: relative;">
        <div style="position: absolute; left: 0; bottom: 0; width: 100%; height: 78%; background: linear-gradient(180deg, {{accent}}, #ff6b7a);"></div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 46px; top: 132px; max-width: 640px;">
    <div style="display: inline-flex; align-items: center; gap: 9px; height: 26px; padding: 0 12px; background: rgba(225,29,72,0.9);">
      <span style="width: 6px; height: 6px; border-radius: 999px; background: #fff;"></span>
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 2.2px; color: #fff;">RUNNING NOW</span>
    </div>
    <div style="margin-top: 16px; font-size: 76px; font-weight: 700; line-height: 0.98; letter-spacing: -2px; color: #ffffff; text-shadow: 0 6px 40px rgba(0,0,0,0.7);">VALORANT</div>
    <div style="margin-top: 14px; display: flex; gap: 10px;">
      <div style="height: 52px; padding: 0 30px; background: #ffffff; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: #0a0d16; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#0a0d16"><polygon points="7,4 20,12 7,20"></polygon></svg>
        RESUME
      </div>
      <div style="height: 52px; padding: 0 26px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #e2e8f0;">Close game</div>
    </div>
  </div>

  <div style="position: absolute; left: 46px; right: 46px; top: 452px;">
    <div style="display: flex; align-items: baseline; gap: 16px;">
      <span style="font-size: 15px; font-weight: 700; letter-spacing: 3px;">YOUR GAMES</span>
      <span class="mono" style="font-size: 11px; color: #475569;">14 INSTALLED</span>
      <span style="flex: 1 1 auto; height: 1px; background: rgba(255,255,255,0.07);"></span>
    </div>

    <div style="display: flex; gap: 16px; margin-top: 18px;">
      <sc-for list="{{games}}" as="g" hint-placeholder-count="7">
        <div style="width: 202px; flex: 0 0 auto;">
          <div style="height: 252px; background: {{g.art}}; position: relative; border-top: 3px solid {{g.edge}};">
            <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,7,12,0.92) 4%, transparent 52%);"></div>
            <div style="position: absolute; left: 0; bottom: 0; right: 0; padding: 14px;">
              <div class="mono" style="font-size: 9px; font-weight: 700; letter-spacing: 1.6px; color: {{g.tagFg}};">{{g.source}}</div>
              <div style="margin-top: 5px; font-size: 15px; font-weight: 700; line-height: 1.2; color: #ffffff;">{{g.name}}</div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 78px; border-top: 1px solid rgba(255,255,255,0.07); background: rgba(5,7,12,0.97); display: flex; align-items: center; justify-content: space-between; padding: 0 46px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="mono" style="font-size: 9.5px; font-weight: 700; letter-spacing: 2px; color: #475569;">OPEN</span>
      <sc-for list="{{running}}" as="w" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px 0 13px; background: rgba(255,255,255,0.05); border-left: 2px solid {{w.edge}};">
          <span style="font-size: 12.5px; font-weight: 600; color: #cbd5e1;">{{w.name}}</span>
          <span style="width: 24px; height: 24px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.6" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
          </span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="font-size: 12px; color: #475569;">Finished early? Unused time goes back to your account.</span>
      <div style="height: 46px; padding: 0 24px; border: 1px solid rgba(255,255,255,0.16); display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; letter-spacing: 0.6px; color: #cbd5e1;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="5" width="14" height="14"></rect></svg>
        END SESSION
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#e11d48","options":["#e11d48","#00e5ff","#a855f7","#22c55e"]},"cafeName":{"editor":"text","default":"PLAYTIME"}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#e11d48';

    const g = (name, source, from, to, edge, tagFg) => ({
      name, source, edge, tagFg,
      art: `linear-gradient(155deg, ${from} 0%, ${to} 100%)`,
    });

    return {
      accent,
      cafeName: (this.props.cafeName ?? 'PLAYTIME').toUpperCase(),
      games: [
        g('Counter-Strike 2', 'STEAM',    '#1d3a52', '#0a1018', '#38bdf8', '#7dd3fc'),
        g('GTA V',            'ROCKSTAR', '#164034', '#0a1018', '#34d399', '#6ee7b7'),
        g('Fortnite',         'EPIC',     '#33205a', '#0a1018', '#a855f7', '#d8b4fe'),
        g('Forza Horizon 5',  'XBOX',     '#123f56', '#0a1018', '#22d3ee', '#67e8f9'),
        g('Minecraft',        'XBOX',     '#24401a', '#0a1018', '#84cc16', '#bef264'),
        g('Rocket League',    'EPIC',     '#0f2f5e', '#0a1018', '#60a5fa', '#93c5fd'),
        g('Apex Legends',     'STEAM',    '#4a1a14', '#0a1018', '#f97316', '#fdba74'),
      ],
      running: [
        { name: 'VALORANT', edge: accent },
        { name: 'Chrome',   edge: '#38bdf8' },
      ],
    };
  }
}
</script>
</body>
</html>
