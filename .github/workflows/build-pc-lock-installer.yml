name: Build PC Lock Installer

# Builds BookMyGame-PC-Lock-Setup.exe and publishes it to GitHub Releases so the
# owner dashboard download button works.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version label (shown in release name)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Found ISCC at $p"
            }
          }

      # Runs before the build because it is instant and the build is not. Both
      # recent failures here were plain syntax errors - one in the Inno Setup
      # script, one that would have sat undetected in a PowerShell file until a
      # cafe PC ran it. Parsing costs a second and names the file and line.
      - name: Check the PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem pc-lock-agent -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Host "ok  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location pc-lock-agent/tools
          ./build-installer.ps1 -Version "${{ inputs.version }}"
          $exe = Resolve-Path "../installer/Output/BookMyGame-PC-Lock-Setup.exe"
          Write-Host "Built installer: $exe"
          Get-Item $exe | Format-List FullName, Length

      # A three-byte file a cafe PC can fetch every few hours. Reading the
      # version from the GitHub API instead would work, but unauthenticated API
      # calls are rate limited per IP - and every PC in one cafe shares an IP.
      - name: Write version file
        shell: pwsh
        run: |
          "${{ inputs.version }}" | Out-File -FilePath version.txt -Encoding ascii -NoNewline
          Get-Content version.txt

      - name: Upload workflow artifact (backup download)
        uses: actions/upload-artifact@v4
        with:
          name: BookMyGame-PC-Lock-Setup
          path: pc-lock-agent/installer/Output/BookMyGame-PC-Lock-Setup.exe
          retention-days: 90

      - name: Remove old pc-lock-latest tag if present
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete pc-lock-latest -y 2>/dev/null || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/pc-lock-latest" 2>/dev/null || true

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: pc-lock-latest
          name: PC Lock Installer v${{ inputs.version }}
          body: Automated build of BookMyGame-PC-Lock-Setup.exe for café PC setup.
          artifacts: "pc-lock-agent/installer/Output/BookMyGame-PC-Lock-Setup.exe,version.txt"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
