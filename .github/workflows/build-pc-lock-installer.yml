name: Build PC Lock Installer

# Builds BookMyGame-PC-Lock-Setup.exe and publishes it to GitHub Releases so the
# owner dashboard download button works.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version label (shown in release name)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Found ISCC at $p"
            }
          }

      # Runs before the build because it is instant and the build is not. Both
      # recent failures here were plain syntax errors - one in the Inno Setup
      # script, one that would have sat undetected in a PowerShell file until a
      # cafe PC ran it. Parsing costs a second and names the file and line.
      - name: Check the PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem pc-lock-agent -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Host "ok  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      # Parsing proves the script is valid PowerShell; it does not prove Task
      # Scheduler will accept what the script builds. It would not - a duration
      # of [TimeSpan]::MaxValue is rejected, Register-ScheduledTask threw, and
      # since that script stops on error it exited before registering anything,
      # so every PC installed from that build ended up with no lock on it.
      #
      # Registering the real trigger shapes here catches that, and also settles
      # the question that caused it: whether a repetition with no duration
      # survives registration. It does - which is why none is given.
      # The installer runs install-startup.ps1 through cmd, and cmd's quoting
      # rule silently ate the command: quotes survive only when there are
      # exactly two of them, and that line has ten. cmd stripped the first and
      # last, the program name became nonsense, and it exited 1 without ever
      # starting PowerShell. The script had never run on any machine.
      #
      # Reproduced here with the same shape of command, because the failure is
      # invisible by inspection and reads as a problem in the script it never
      # reached.
      - name: Check the installer's cmd quoting
        shell: pwsh
        run: |
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $probe = Join-Path $env:RUNNER_TEMP "quoting-probe.ps1"
          $log = Join-Path $env:RUNNER_TEMP "quoting-probe.log"
          'param([string]$ExePath, [string]$GamingUser)' | Set-Content $probe
          'Write-Host "probe ran: $ExePath / $GamingUser"'  | Add-Content $probe
          'exit 0'                                          | Add-Content $probe

          # Exactly the shape the .iss builds: quoted program, quoted args, a
          # quoted redirect target - and the outer pair that makes cmd behave.
          $inner = '"' + $ps + '" -ExecutionPolicy Bypass -NoProfile -File "' + $probe +
                   '" -ExePath "C:\BookMyGame\PcLockAgent\PcLockAgent.exe"' +
                   ' -GamingUser "GamingUser" >> "' + $log + '" 2>&1'

          & cmd.exe /C ('"' + $inner + '"')
          $code = $LASTEXITCODE

          if ($code -ne 0) {
            Write-Host "::error::cmd returned $code - the quoting is wrong again"
            exit 1
          }
          if (-not (Test-Path $log) -or -not ((Get-Content $log -Raw) -match 'probe ran')) {
            Write-Host "::error::cmd exited 0 but the script never ran or never logged"
            exit 1
          }
          Write-Host "ok - cmd starts PowerShell and the redirect lands:"
          Get-Content $log | ForEach-Object { Write-Host "  $_" }

          # And prove the unwrapped form really is broken, so this test is
          # testing something rather than passing by accident.
          & cmd.exe /C $inner 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::error::the unwrapped form succeeded - this test proves nothing"
            exit 1
          }
          Write-Host "ok - the unwrapped form fails with $LASTEXITCODE, as it did in the field"

      - name: Check the scheduled-task triggers are valid
        shell: pwsh
        run: |
          $name = "BookMyGame CI Trigger Check"
          try {
            $action   = New-ScheduledTaskAction -Execute "cmd.exe"
            $logon    = New-ScheduledTaskTrigger -AtLogOn
            $watchdog = New-ScheduledTaskTrigger -Once -At (Get-Date) `
                          -RepetitionInterval (New-TimeSpan -Minutes 1)
            $settings = New-ScheduledTaskSettingsSet -MultipleInstances IgnoreNew -StartWhenAvailable

            Register-ScheduledTask -TaskName $name -Action $action `
              -Trigger $logon, $watchdog -Settings $settings -Force | Out-Null

            $registered = Get-ScheduledTask -TaskName $name
            $repeating = $registered.Triggers | Where-Object { $_.Repetition.Interval }
            if (-not $repeating) {
              Write-Host "::error::The watchdog repetition was dropped on registration"
              exit 1
            }
            Write-Host "ok - triggers register, repetition survives as $($repeating.Repetition.Interval)"
          } finally {
            Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction SilentlyContinue
          }

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location pc-lock-agent/tools
          ./build-installer.ps1 -Version "${{ inputs.version }}"
          $exe = Resolve-Path "../installer/Output/BookMyGame-PC-Lock-Setup.exe"
          Write-Host "Built installer: $exe"
          Get-Item $exe | Format-List FullName, Length

      # An unstamped exe reports 1.0.0 forever. Every update check would then
      # see something newer, install it, read 1.0.0 again, and do it all again
      # four hours later - a cafe PC reinstalling itself in a loop. Cheap to
      # assert here, miserable to notice in the field.
      - name: Check the version was stamped into the exe
        shell: pwsh
        run: |
          $exe = "pc-lock-agent/publish/PcLockAgent.exe"
          if (-not (Test-Path $exe)) { throw "No published exe at $exe" }
          $stamped = (Get-Item $exe).VersionInfo.FileVersion
          $want = "${{ inputs.version }}"
          Write-Host "exe reports '$stamped', release is '$want'"
          if (-not $stamped.StartsWith($want)) {
            Write-Host "::error::Version not stamped - exe says '$stamped', expected '$want'"
            exit 1
          }
          Write-Host "ok - auto-update will compare these correctly"

      # A three-byte file a cafe PC can fetch every few hours. Reading the
      # version from the GitHub API instead would work, but unauthenticated API
      # calls are rate limited per IP - and every PC in one cafe shares an IP.
      - name: Write version file
        shell: pwsh
        run: |
          "${{ inputs.version }}" | Out-File -FilePath version.txt -Encoding ascii -NoNewline
          Get-Content version.txt

      - name: Upload workflow artifact (backup download)
        uses: actions/upload-artifact@v4
        with:
          name: BookMyGame-PC-Lock-Setup
          path: pc-lock-agent/installer/Output/BookMyGame-PC-Lock-Setup.exe
          retention-days: 90

      - name: Remove old pc-lock-latest tag if present
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete pc-lock-latest -y 2>/dev/null || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/pc-lock-latest" 2>/dev/null || true

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: pc-lock-latest
          name: PC Lock Installer v${{ inputs.version }}
          body: Automated build of BookMyGame-PC-Lock-Setup.exe for café PC setup.
          artifacts: "pc-lock-agent/installer/Output/BookMyGame-PC-Lock-Setup.exe,version.txt"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
